name: Lingxi Meta Web CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: public-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-web:
    name: Linux Web build and anonymous flow
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify shared, mobile, and data quality gates
        run: pnpm run check

      - name: Build the public Next.js site
        run: pnpm --filter @liuyao/web run build

      - name: Install Playwright browsers
        run: pnpm --filter @liuyao/web exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser, mobile, and accessibility flows
        run: pnpm run test:web:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-web-browser-diagnostics
          if-no-files-found: ignore
          path: |
            apps/web/playwright-report
            apps/web/test-results
